<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="QHDALabs logo — Q rendered as a graph state with a measurement tail">
  <!-- Q ring -->
  <circle cx="32" cy="28" r="19" fill="none" stroke="#3D43B4" stroke-width="2.5"/>
  <!-- measurement tail -->
  <line x1="43.2" y1="43.4" x2="54" y2="54" stroke="#3D43B4" stroke-width="2.5" stroke-linecap="round"/>
  <!-- graph-state nodes on the ring -->
  <g fill="#FAFBFC" stroke="#14171C" stroke-width="1.5">
    <circle cx="32"   cy="9"    r="3"/>
    <circle cx="50.1" cy="22.1" r="3"/>
    <circle cx="43.2" cy="43.4" r="3"/>
    <circle cx="20.8" cy="43.4" r="3"/>
    <circle cx="13.9" cy="22.1" r="3"/>
  </g>
  <!-- measured node -->
  <circle cx="54" cy="54" r="3.5" fill="#3D43B4"/>
</svg>

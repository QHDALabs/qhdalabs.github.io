<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QHDALabs Papers</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #f9f9f8;
      color: #1a1a1a;
      padding: 2rem 1rem;
      max-width: 760px;
      margin: 0 auto;
    }
    header { margin-bottom: 2rem; border-bottom: 1px solid #e5e5e2; padding-bottom: 1.25rem; }
    header h1 { font-size: 22px; font-weight: 500; }
    header p { font-size: 14px; color: #666; margin-top: 4px; }

    .paper-card {
      background: #fff;
      border: 1px solid #e5e5e2;
      border-radius: 12px;
      padding: 1.25rem 1.5rem;
      margin-bottom: 1.25rem;
    }
    .paper-meta {
      display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
      margin-bottom: 8px;
    }
    .year { font-size: 13px; color: #888; }
    .tag {
      font-size: 12px; color: #555;
      background: #f0efeb; border: 1px solid #e0deda;
      border-radius: 99px; padding: 2px 10px;
    }
    .paper-title { font-size: 17px; font-weight: 500; margin-bottom: 4px; }
    .paper-authors { font-size: 13px; color: #888; margin-bottom: 10px; }
    .paper-abstract { font-size: 14px; color: #555; line-height: 1.65; margin-bottom: 14px; }
    .paper-actions { display: flex; gap: 8px; flex-wrap: wrap; }

    .btn {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 13px; padding: 6px 14px;
      border-radius: 8px; border: 1px solid #ccc;
      background: transparent; color: #1a1a1a;
      text-decoration: none; cursor: pointer;
      transition: background 0.15s;
    }
    .btn:hover { background: #f0efeb; }
    .btn-pdf {
      background: #e8f1fb; color: #1a5fa5;
      border-color: transparent;
    }
    .btn-pdf:hover { background: #d5e6f8; }

    .loading { color: #888; font-size: 14px; padding: 1rem 0; }
    .error { color: #c0392b; font-size: 14px; padding: 1rem 0; }
  </style>
</head>
<body>
  <header>
    <h1>QHDALabs papers</h1>
    <p>Research publications</p>
  </header>
  <div id="papers"><p class="loading">Loading papers…</p></div>

  <script>
    const sources = [
      "https://raw.githubusercontent.com/qhdalabs/QMNet/main/paper.json"
    ];

    function getPdfUrl(paper, jsonUrl) {
      if (!paper.pdf) return null;
      // Build raw URL: same base as the json file, just swap filename
      const base = jsonUrl.replace(/\/[^/]+$/, "/");
      return base + encodeURIComponent(paper.pdf);
    }

    async function loadPapers() {
      const container = document.getElementById("papers");
      container.innerHTML = "";

      const results = await Promise.allSettled(
        sources.map(url => fetch(url).then(r => r.json()).then(p => ({ paper: p, url })))
      );

      let any = false;
      for (const result of results) {
        if (result.status !== "fulfilled") continue;
        const { paper, url } = result.value;
        any = true;

        const pdfUrl = getPdfUrl(paper, url);
        const authors = Array.isArray(paper.authors)
          ? paper.authors.join(", ")
          : paper.authors || "";
        const tags = (paper.tags || [])
          .map(t => `<span class="tag">${t}</span>`)
          .join("");

        const card = document.createElement("div");
        card.className = "paper-card";
        card.innerHTML = `
          <div class="paper-meta">
            ${paper.year ? `<span class="year">${paper.year}</span>` : ""}
            ${tags}
          </div>
          <div class="paper-title">${paper.title}</div>
          ${authors ? `<div class="paper-authors">${authors}</div>` : ""}
          <div class="paper-abstract">${paper.abstract || ""}</div>
          <div class="paper-actions">
            ${pdfUrl ? `<a class="btn btn-pdf" href="${pdfUrl}" target="_blank" rel="noopener">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
              PDF
            </a>` : ""}
            ${paper.repo ? `<a class="btn" href="${paper.repo}" target="_blank" rel="noopener">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"/></svg>
              Repository
            </a>` : ""}
          </div>
        `;
        container.appendChild(card);
      }

      if (!any) {
        container.innerHTML = `<p class="error">Could not load papers.</p>`;
      }
    }

    loadPapers();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QHDALabs</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #f9f9f8;
      color: #1a1a1a;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .container { max-width: 480px; width: 100%; padding: 2rem 1rem; }
    header { margin-bottom: 2.5rem; }
    h1 { font-size: 22px; font-weight: 500; }
    p { font-size: 14px; color: #888; margin-top: 4px; }

    .links { display: flex; flex-direction: column; gap: 12px; }
    .link-card {
      display: flex; align-items: center; gap: 14px;
      background: #fff;
      border: 1px solid #e5e5e2;
      border-radius: 12px;
      padding: 1rem 1.25rem;
      text-decoration: none;
      color: #1a1a1a;
      transition: background 0.15s, border-color 0.15s;
    }
    .link-card:hover { background: #f0efeb; border-color: #d0d0cc; }
    .icon {
      width: 36px; height: 36px; border-radius: 8px;
      background: #e8f1fb; color: #1a5fa5;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .icon svg { width: 18px; height: 18px; }
    .link-title { font-size: 15px; font-weight: 500; }
    .link-desc { font-size: 13px; color: #888; margin-top: 2px; }
    .arrow { margin-left: auto; color: #ccc; }
    .arrow svg { width: 16px; height: 16px; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>QHDALabs</h1>
      <p>Quantum research</p>
    </header>
    <nav class="links">
      <a class="link-card" href="https://qhdalabs.github.io/papers/">
        <div class="icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
        </div>
        <div>
          <div class="link-title">Papers</div>
          <div class="link-desc">Research publications</div>
        </div>
        <div class="arrow">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
        </div>
      </a>
      <a class="link-card" href="https://qhdalabs.github.io/QHDALabs/">
        <div class="icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"/></svg>
        </div>
        <div>
          <div class="link-title">QHDALabs</div>
          <div class="link-desc">GitHub repository</div>
        </div>
        <div class="arrow">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
        </div>
      </a>
    </nav>
  </div>
</body>
</html>
